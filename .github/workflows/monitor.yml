name: Government filings monitor

on:
  schedule:
    # Twice an hour is plenty: the source data refreshes about once a day, and an unchanged
    # file costs almost nothing (the bot checks an ETag first). GitHub runs schedules loosely
    # (sometimes hourly or worse), which is fine here. Offset from :00, GitHub's busiest minute.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: print alerts in the log, send nothing, save nothing'
        type: boolean
        default: false

concurrency:
  group: congress-monitor
  cancel-in-progress: false

permissions:
  contents: write   # only used to save state.json to the 'monitor-state' branch

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # optional tuning: repository *variables* (Settings > Secrets and variables > Variables)
      MIN_AMOUNT: ${{ vars.MIN_AMOUNT }}
      ONLY_TICKERS: ${{ vars.ONLY_TICKERS }}
      BRANCH: ${{ vars.BRANCH }}
      MAX_FILING_AGE_DAYS: ${{ vars.MAX_FILING_AGE_DAYS }}
      WATCH_FILERS: ${{ vars.WATCH_FILERS }}
      INSIDER_STATE_URL: ${{ vars.INSIDER_STATE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin monitor-state >/dev/null 2>&1; then
            git fetch -q --depth=1 origin monitor-state
            git show FETCH_HEAD:state.json > state/state.json
            echo "restored state"
          else
            echo "no saved state yet (first run)"
          fi

      - name: Run monitor
        run: python -m congress_monitor ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # One commit on the monitor-state branch, force-pushed, so history never grows.
      - name: Save state
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f state/state.json ] || exit 0
          d=$(mktemp -d)
          cp state/state.json "$d/state.json"
          cd "$d"
          git init -q -b monitor-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" monitor-state
